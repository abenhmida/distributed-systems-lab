version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dsl-postgres-order
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

